name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          df -h

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Prebuild Android
        run: npx expo prebuild -p android --clean

      - name: Build installable APK
        run: cd android && ./gradlew assembleRelease --no-daemon --console=plain

      - name: Prepare versioned APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/hn-later-v${APP_VERSION}.apk"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hn-later-v${{ env.APP_VERSION }}-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${APP_VERSION}"
          apk="dist/hn-later-v${APP_VERSION}.apk"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "HN Later ${tag}" \
              --notes "Installable Android APK built from commit ${GITHUB_SHA}." \
              --latest
          fi
